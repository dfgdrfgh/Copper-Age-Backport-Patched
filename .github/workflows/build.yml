name: Build Mod

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Fabric and NeoForge
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload Fabric JAR
        uses: actions/upload-artifact@v4
        with:
          name: copper-age-backport-patched-fabric
          path: |
            fabric/build/libs/*.jar
            !fabric/build/libs/*-sources.jar
            !fabric/build/libs/*-javadoc.jar
          if-no-files-found: error

      - name: Upload NeoForge JAR
        uses: actions/upload-artifact@v4
        with:
          name: copper-age-backport-patched-neoforge
          path: |
            neoforge/build/libs/*.jar
            !neoforge/build/libs/*-sources.jar
            !neoforge/build/libs/*-javadoc.jar
          if-no-files-found: error

      - name: Publish direct-download JARs to GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="build-${GITHUB_RUN_NUMBER}"
          files=()

          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(
            find fabric/build/libs neoforge/build/libs \
              -maxdepth 1 \
              -type f \
              -name '*.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-javadoc.jar' \
              -print0
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release JARs found."
            exit 1
          fi

          gh release create "$tag" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Copper Age Backport Patched build #${GITHUB_RUN_NUMBER}" \
            --notes "Automated Fabric and NeoForge build from commit ${GITHUB_SHA}." \
            --latest
