name: Build Mod

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Fabric and NeoForge
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload Fabric JAR
        uses: actions/upload-artifact@v4
        with:
          name: copperagebackport-fabric-1.21.1-0.1.5
          path: fabric/build/libs/copperagebackport-fabric-1.21.1-0.1.5.jar
          if-no-files-found: error
          compression-level: 0

      - name: Upload NeoForge JAR
        uses: actions/upload-artifact@v4
        with:
          name: copperagebackport-neoforge-1.21.1-0.1.5
          path: neoforge/build/libs/copperagebackport-neoforge-1.21.1-0.1.5.jar
          if-no-files-found: error
          compression-level: 0
