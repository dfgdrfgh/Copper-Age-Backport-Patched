name: Build Mod

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Fabric and NeoForge
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --build-cache --stacktrace

      - name: Upload Fabric JAR
        uses: actions/upload-artifact@v7.0.1
        with:
          path: fabric/build/libs/copperagebackport-fabric-1.21.1-0.1.5.jar
          if-no-files-found: error
          archive: false

      - name: Upload NeoForge JAR
        uses: actions/upload-artifact@v7.0.1
        with:
          path: neoforge/build/libs/copperagebackport-neoforge-1.21.1-0.1.5.jar
          if-no-files-found: error
          archive: false
